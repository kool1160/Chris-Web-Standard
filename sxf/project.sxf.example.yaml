# Example only. Do not register until the project is configured.
# Untouched template test/build commands intentionally fail.
schemaVersion: "0.1"
project:
  name: "REPLACE_ME_WEB"
  description: "Unconfigured website project created from Chris-Web-Standard"
  status: "greenfield"
  documentationRoot: "docs"
commands:
  install: "echo TEMPLATE_NOT_CONFIGURED"
  lint: "echo TEMPLATE_NOT_CONFIGURED"
  test: "echo TEMPLATE_NOT_CONFIGURED && exit 1"
  integrationTest: "echo TEMPLATE_NOT_CONFIGURED && exit 1"
  build: "echo TEMPLATE_NOT_CONFIGURED && exit 1"
autonomy:
  createIssues: false
  createBranches: true
  openPullRequests: true
  mergeToDefault: false
  deployToStaging: false
  deployToProduction: false
verification:
  independent: true
  requireDifferentBackend: false
  requireDeterministicChecks: true
  requireUiEvidence: true
budgets:
  maxCostUsd: 10
  maxRuntimeMinutes: 60
  maxAgentTurns: 40
  maxRepairCycles: 2
restrictions:
  protectedPaths:
    - "PROJECT_SCOPE.md"
    - "CURRENT.md"
    - "OPERATOR_PROTOCOL.md"
  prohibitedActions:
    - "production-data-deletion"
    - "production-deployment"
    - "secret-exposure"
    - "billing-modification"
    - "scope-expansion"
    - "unapproved-domain-dns-change"
    - "unapproved-tracking-privacy-change"
  allowedNetworkDomains: []
